# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The quality gate from AGENTS.md, on every pull request into main and
# every push to main: rustfmt, clippy with warnings denied, the Rust
# tests on the declared MSRV and on stable, Rust line and function
# coverage at 100% (cargo-llvm-cov), and the Python tests with the 100%
# line and branch coverage floor against the built extension.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.89", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: |
          libdir="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          RUSTFLAGS="-C link-arg=-Wl,-rpath,$libdir" cargo test --no-default-features --locked

  rust-coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: 100% line and function coverage (make coverage-rust)
        run: make coverage-rust PYTHON="$(command -v python3)"

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the extension and the dev extra into a virtualenv
        run: |
          python -m venv .venv
          python -c "import pathlib, subprocess, sys, tomllib; requirements = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['build-system']['requires']; subprocess.check_call(['.venv/bin/python', '-m', 'pip', 'install', *requirements])"
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release --extras dev
      - name: ruff
        run: .venv/bin/ruff check .
      - name: mypy
        run: .venv/bin/mypy python
      - name: pytest (100% line and branch coverage)
        run: .venv/bin/pytest tests/
      - name: Release versions agree
        run: .venv/bin/python scripts/check_release.py
