# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Fuzz the native validators with cargo-fuzz (libFuzzer, nightly Rust)
# for two minutes on every pull request into main and weekly. The
# committed corpus is also replayed on stable by `cargo test`
# (src/tests/corpus.rs), so this job looks for new findings; a crash
# uploads the failing input.
name: Fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (validators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz for 120 seconds
        run: make fuzz FUZZ_SECONDS=120 PYTHON="$(command -v python3)"
      - name: Upload a crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
